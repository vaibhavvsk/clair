services:

  # ── Local OCI registry ──────────────────────────────────────────────────────
  # Receives `docker push` from scan.sh. Always running.
  registry:
    image: registry:2
    container_name: clair-registry
    ports:
      - "5000:5000"
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # Shared by the updater (one-shot) and the scan server (permanent).
  # Vulnerability data persists in the named volume across restarts.
  clair-db:
    image: postgres:15-alpine
    container_name: clair-db
    environment:
      POSTGRES_USER: clair
      POSTGRES_PASSWORD: clair
      POSTGRES_DB: clair
    volumes:
      - clair-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clair"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── CVE updater ─────────────────────────────────────────────────────────────
  # One-shot: run on demand or on a schedule to refresh vulnerability data.
  # It pulls all feeds from the internet, writes them to clair-db, then exits.
  # Never serves scan requests — no ports exposed.
  #
  # Usage:
  #   docker compose --profile updater run --rm clair-updater
  #   (or just:  ./mirror.sh refresh)
  #
  # After this finishes, run ./mirror.sh dump to snapshot the DB, then
  # docker compose restart clair-server so it picks up the new data.
  clair-updater:
    profiles: [updater]
    image: quay.io/projectquay/clair:4.9.0
    container_name: clair-updater
    depends_on:
      clair-db:
        condition: service_healthy
    environment:
      CLAIR_CONF: /etc/clair/config.yaml
      CLAIR_MODE: updater
      PGHOST: clair-db
      PGPORT: "5432"
      PGUSER: clair
      PGPASSWORD: clair
      PGDATABASE: clair
      PGSSLMODE: disable
    volumes:
      - ./clair-config-updater.yaml:/etc/clair/config.yaml:ro
    # No ports — updater mode does not expose an HTTP API
    restart: "no"

  # ── pg_restore — load vuln-mirror.dump into clair-db ───────────────────────
  # One-shot: run by ./mirror.sh refresh (after dump is taken) to reload
  # clair-db from the snapshot so the scan server picks up new CVEs without
  # ever having to restart or wait for an updater pass.
  #
  # Usage (internal — called by mirror.sh):
  #   docker compose --profile updater run --rm import
  import:
    profiles: [updater]
    image: postgres:15-alpine
    container_name: clair-import
    depends_on:
      clair-db:
        condition: service_healthy
    volumes:
      - ./vuln-mirror.dump:/tmp/vuln-mirror.dump:ro
    environment:
      PGPASSWORD: clair
    command:
      - sh
      - -c
      - |
        echo '>>> Wiping existing vulnerability data...' &&
        psql -h clair-db -U clair -d clair -c 'TRUNCATE vuln, uo_vuln, update_operation, updater_status CASCADE;' &&
        echo '>>> Importing from vuln-mirror.dump...' &&
        pg_restore -h clair-db -U clair -d clair --data-only --disable-triggers /tmp/vuln-mirror.dump &&
        echo '>>> Done.' &&
        psql -h clair-db -U clair -d clair -c 'SELECT COUNT(*) AS imported_vulns FROM vuln;'
    entrypoint: []
    restart: "no"

  # ── Clair scan server ───────────────────────────────────────────────────────
  # Permanent: always running, always offline (updaters disabled).
  # Serves scan requests on port 6060. Reads vulnerability data from clair-db.
  # Restart it after ./mirror.sh refresh to pick up the newly loaded CVEs.
  #
  # Usage:  docker compose up -d clair-server
  clair-server:
    image: quay.io/projectquay/clair:4.9.0
    container_name: clair-server
    depends_on:
      clair-db:
        condition: service_healthy
    environment:
      CLAIR_CONF: /etc/clair/config.yaml
      CLAIR_MODE: combo
      PGHOST: clair-db
      PGPORT: "5432"
      PGUSER: clair
      PGPASSWORD: clair
      PGDATABASE: clair
      PGSSLMODE: disable
    volumes:
      - ./clair-config-offline.yaml:/etc/clair/config.yaml:ro
    ports:
      - "6060:6060"
      - "8089:8089"
    extra_hosts:
      - "localhost:172.18.0.1"
    restart: unless-stopped

volumes:
  clair-db-data:
