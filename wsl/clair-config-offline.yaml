# Clair v4.9.0 — OFFLINE mode configuration
# Live updaters are disabled. Vulnerability data must be pre-loaded
# via pg_restore from a vuln-mirror.dump file.
http_listen_addr: "0.0.0.0:6060"
introspection_addr: "0.0.0.0:8089"
log_level: info

indexer:
  connstring: "host=clair-db port=5432 user=clair password=clair dbname=clair sslmode=disable"
  scanlock_retry: 10
  layer_scan_concurrency: 5
  migrations: true

matcher:
  connstring: "host=clair-db port=5432 user=clair password=clair dbname=clair sslmode=disable"
  indexer_addr: "http://localhost:6060"
  migrations: true
  # Disable live updater runs entirely
  disable_updaters: true

matchers:
  names:
    - alpine-matcher
    - aws-matcher
    - debian-matcher
    - gobin
    - java-maven
    - oracle
    - photon
    - python
    - rhel
    - rhel-container-matcher
    - suse
    - ubuntu

# Empty sets = no updaters run at startup
updaters:
  sets: []
